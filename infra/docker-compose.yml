services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
