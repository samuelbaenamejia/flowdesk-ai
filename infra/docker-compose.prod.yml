services:
  backend:
    image: ghcr.io/flowdesk-ai/backend:latest
    build: []
    environment:
      ENVIRONMENT: production
      PYTHONDONTWRITEBYTECODE: "1"
    mem_limit: 512M
    cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid

  frontend:
    image: ghcr.io/flowdesk-ai/frontend:latest
    build: []
    mem_limit: 512M
    cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
      - /app/.next/cache:size=128M,noexec,nosuid

  n8n:
    image: n8nio/n8n:1.74.1
    mem_limit: 1G
    cpus: "1.0"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
