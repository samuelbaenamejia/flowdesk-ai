services:
  backend:
    ports: []

  frontend:
    ports: []

  n8n:
    ports: []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-app.flowdesk.ai}
      - N8N_SUBDOMAIN=${N8N_SUBDOMAIN:-n8n}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128M
    cpus: "0.25"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  caddy_data:
