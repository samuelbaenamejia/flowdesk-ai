name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .[dev]

      - run: ruff check app/ tests/ --ignore B008

      - run: pytest tests/

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowdesk
          POSTGRES_PASSWORD: flowdesk
          POSTGRES_DB: flowdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdesk -d flowdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://flowdesk:flowdesk@localhost:5432/flowdesk_test
      DATABASE_URL: postgresql+asyncpg://flowdesk:flowdesk@localhost:5432/flowdesk_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .[dev]

      - name: Check Alembic single head
        run: |
          HEADS=$(alembic heads | grep -c "(head)")
          echo "heads=$HEADS"
          test "$HEADS" = "1" || { echo "Expected exactly one Alembic head but found $HEADS"; exit 1; }

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Run test suite on PostgreSQL (via Alembic schema)
        run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build
