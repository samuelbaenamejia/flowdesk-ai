services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    mem_limit: 64M
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "node", "server/server.js", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  uptime_kuma_data:
